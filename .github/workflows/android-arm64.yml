name: Build libreplaygain_scanner arm64
on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - .github/workflows/android-arm64.yml
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build make curl git unzip
      - name: Build dependencies
        run: |
          set -e
          echo "INLINE_DEPS_BUILD v1"
          : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME not set}"
          NDK_DIR="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          API=29
          TARGET=aarch64-linux-android
          SYSROOT="$TOOLCHAIN/sysroot"
          export CC="$TOOLCHAIN/bin/${TARGET}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${TARGET}${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS="-O3 -fPIC"
          export CXXFLAGS="-O3 -fPIC"
          TC="$NDK_DIR/build/cmake/android.toolchain.cmake"
          DEPS_DIR="$GITHUB_WORKSPACE/deps"
          SRC_DIR="$GITHUB_WORKSPACE/deps-src"
          mkdir -p "$DEPS_DIR" "$SRC_DIR"
          cd "$SRC_DIR"
          echo "PWD: $(pwd)"
          echo "DEPS_DIR: $DEPS_DIR"

          fetch_tar() {
            rm -f "$2"
            curl -fL --retry 3 -o "$2" "$1"
            if ! gzip -t "$2" 2>/dev/null; then
              echo "Download failed: $1 did not return a valid gzip file" >&2
              exit 1
            fi
          }

          check_lib() {
            if [ ! -f "$DEPS_DIR/lib/$1" ]; then
              echo "ERROR: $1 missing from $DEPS_DIR/lib after install" >&2
              exit 1
            fi
            echo "OK: $1"
          }

          echo "=== zlib ==="
          rm -rf zlib-1.3.1 zlib-build
          fetch_tar https://zlib.net/fossils/zlib-1.3.1.tar.gz zlib.tar.gz
          tar xzf zlib.tar.gz
          cmake -S zlib-1.3.1 -B zlib-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$API             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DBUILD_SHARED_LIBS=OFF
          cmake --build zlib-build
          cmake --install zlib-build
          check_lib libz.a

          echo "=== libebur128 ==="
          rm -rf libebur128 ebur128-build
          git clone --depth 1 https://github.com/jiixyj/libebur128.git
          cmake -S libebur128 -B ebur128-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$API             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DBUILD_SHARED_LIBS=OFF
          cmake --build ebur128-build
          cmake --install ebur128-build
          check_lib libebur128.a

          echo "=== fmt ==="
          rm -rf fmt-11.1.4 fmt-build
          fetch_tar https://github.com/fmtlib/fmt/archive/refs/tags/11.1.4.tar.gz fmt.tar.gz
          tar xzf fmt.tar.gz
          cmake -S fmt-11.1.4 -B fmt-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$API             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DBUILD_SHARED_LIBS=OFF             -DFMT_DOC=OFF -DFMT_TEST=OFF
          cmake --build fmt-build
          cmake --install fmt-build
          check_lib libfmt.a

          echo "=== taglib ==="
          rm -rf taglib-2.0.2 taglib-build
          fetch_tar https://taglib.org/releases/taglib-2.0.2.tar.gz taglib.tar.gz
          tar xzf taglib.tar.gz
          if [ ! -f taglib-2.0.2/3rdparty/utfcpp/source/utf8.h ]; then
            fetch_tar https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.0.6.tar.gz utfcpp.tar.gz
            mkdir -p taglib-2.0.2/3rdparty/utfcpp
            tar xzf utfcpp.tar.gz -C taglib-2.0.2/3rdparty/utfcpp --strip-components=1
          fi
          cmake -S taglib-2.0.2 -B taglib-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$API             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" -DCMAKE_PREFIX_PATH="$DEPS_DIR"             -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BINDINGS=OFF
          cmake --build taglib-build
          cmake --install taglib-build
          check_lib libtag.a

          echo "=== ffmpeg ==="
          rm -rf ffmpeg-7.1
          fetch_tar https://ffmpeg.org/releases/ffmpeg-7.1.tar.gz ffmpeg.tar.gz
          tar xzf ffmpeg.tar.gz
          cd ffmpeg-7.1
          ./configure             --prefix="$DEPS_DIR"             --target-os=android --arch=aarch64 --cpu=armv8-a             --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP"             --sysroot="$SYSROOT"             --enable-cross-compile --enable-asm --enable-pic             --disable-programs --disable-doc             --disable-avdevice --disable-swscale --disable-postproc --disable-avfilter             --disable-network --disable-encoders --disable-muxers --disable-debug             --extra-cflags="-O3 -fPIC"             --extra-ldflags="-Wl,-z,max-page-size=16384"
          make -j$(nproc)
          make install
          cd ..
          check_lib libavformat.a
          check_lib libavcodec.a
          check_lib libavutil.a
          check_lib libswresample.a

          echo "=== installed ==="
          ls "$DEPS_DIR/lib"
      - name: Verify dependencies
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/deps/lib"
          for lib in libz.a libebur128.a libfmt.a libtag.a libavformat.a libavcodec.a libavutil.a libswresample.a; do
            if [ ! -f "$GITHUB_WORKSPACE/deps/lib/$lib" ]; then
              echo "MISSING: $lib"
              exit 1
            fi
          done
          echo "All dependency libraries present"
      - name: Configure scanner lib
        run: |
          rm -rf android/build
          cmake -S android -B android/build -G Ninja             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-29             -DDEPS_PREFIX=$GITHUB_WORKSPACE/deps
      - name: Build scanner lib
        run: cmake --build android/build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libreplaygain_scanner-arm64-v8a
          path: android/build/libreplaygain_scanner.so
