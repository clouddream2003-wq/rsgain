name: Build libreplaygain_scanner arm64
on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      -.github/workflows/android-arm64.yml
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build make curl git unzip
      - name: Build dependencies
        run: bash android/build-deps.sh
      - name: Configure scanner lib
        run: >
          cmake -S android -B android/build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DDEPS_PREFIX=$GITHUB_WORKSPACE/deps
      - name: Build scanner lib
        run: cmake --build android/build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libreplaygain_scanner-arm64-v8a
          path: android/build/libreplaygain_scanner.so
