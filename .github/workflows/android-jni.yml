name: android-jni
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config unzip
      - name: Configure
        run: |
          cmake -S jni -B build-android -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-android
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: librgain_jni-arm64-v8a
          path: build-android/librgain_jni.so
